; ESP32-S3-DevKitC-1, Modul WROOM-1 N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
; Bring-up-Firmware für die Kette ESP32-S3 ↔ A121 (siehe docs/HARDWARE.md)

[env:esp32s3-n16r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = nativer USB-Port (USB-CDC); Serial0 = UART0 an der USB-UART-Bridge
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
