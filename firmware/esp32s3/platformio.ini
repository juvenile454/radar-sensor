; ESP32-S3-DevKitC-1, Modul WROOM-1 N16R8 (16 MB Flash, 8 MB Octal-PSRAM)
; Bring-up-Firmware für die Kette ESP32-S3 ↔ A121 (siehe docs/HARDWARE.md)

[platformio]
; `pio run` und `pio run -t upload` nur für den Standard (ohne Schalter); die V6-Umgebung nur ausdrücklich mit -e
default_envs = esp32s3-n16r8

[env:esp32s3-n16r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = nativer USB-Port (USB-CDC); Serial0 = UART0 an der USB-UART-Bridge
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; kein madd.s: DSP-Ergebnisse bitgleich zur Nachrechnung am PC und am Handy (host/dsp_replay, -ffp-contract=off)
    -ffp-contract=off

; V6 "Puls nach Bewegung wiederfinden" (docs/EXPERIMENTS.md, Abschnitt V6): derselbe Aufbau mit Schalter A121_DSP_REACQ.
; Nur der Schalter; die Varianten A121_DSP_REACQ_PERIOD und A121_DSP_PHASE_SLOPE sind verworfen und bleiben aus.
; @HELLO meldet die Firmware mit Anhang "-reacq".
[env:esp32s3-n16r8-reacq]
extends = env:esp32s3-n16r8
build_flags =
    ${env:esp32s3-n16r8.build_flags}
    -DA121_DSP_REACQ
