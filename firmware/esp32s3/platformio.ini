; ESP32-S3-DevKitC-1, WROOM-1 N16R8 module (16 MB flash, 8 MB octal PSRAM)
; Bring-up firmware for the ESP32-S3 ↔ A121 chain (see docs/HARDWARE.md)

[platformio]
; `pio run` and `pio run -t upload` only for the default (no switch); use the V6 environment only explicitly with -e
default_envs = esp32s3-n16r8

[env:esp32s3-n16r8]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial = native USB port (USB-CDC); Serial0 = UART0 on the USB-UART bridge
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; no madd.s: DSP results bit-identical to the replay on the PC and on the phone (host/dsp_replay, -ffp-contract=off)
    -ffp-contract=off

; V6 "reacquire pulse after motion" (docs/EXPERIMENTS.md, section V6): same setup with the A121_DSP_REACQ compile switch.
; Only that switch; the variants A121_DSP_REACQ_PERIOD and A121_DSP_PHASE_SLOPE are rejected and stay off.
; The firmware reports @HELLO with the suffix "-reacq".
[env:esp32s3-n16r8-reacq]
extends = env:esp32s3-n16r8
build_flags =
    ${env:esp32s3-n16r8.build_flags}
    -DA121_DSP_REACQ
